name: "Pipeline"
cases:
  - name: "Basic pipe"
    stdin: |
      echo hi | grep -l h

  - name: "Longer pipe"
    stdin: |
      echo hi | grep h | wc -l

  - name: "Invert result"
    stdin: |
      ! false
      echo "! false: $?"
      ! true
      echo "! true: $?"

  - name: "Standalone negation (no command)"
    stdin: |
      !
      echo "After !: $?"
      ! !
      echo "After ! !: $?"

  - name: "Exit codes for piped commands"
    test_files:
      - path: "script.sh"
        executable: true
        contents: |
          #!/bin/sh
          (cat; echo -n "-> $1")
          exit $1
    stdin: |
      ./script.sh 10 | ./script.sh 0 | ./script.sh 33

  - name: "Side effects in pipe commands"
    stdin: |
      var=0
      echo "var: ${var}"
      { var=1; }
      echo "var: ${var}"
      { var=2; echo hi; } | cat
      echo "var: ${var}"
      echo hi | { var=3; cat; }
      echo "var: ${var}"

  - name: "pipeline extension"
    stdin: |
      echo -e "hello" |& wc -l
      cat dfdfgdfgdf |& wc -l
      foo() { cat dfgdfg; } |& wc -l

  - name: "Possible broken pipe case"
    stdin: |
      echo hello | var=value

  - name: "printf broken pipe returns 141 in PIPESTATUS"
    stdin: |
      printf '%s\n' {0..10000} | x=1
      echo "Last: $?, PIPESTATUS: ${PIPESTATUS[*]}"

  - name: "Function stage writing more than a pipe buffer before the next stage is spawned"
    # Regression: a shell function used as a non-last pipeline stage must run
    # concurrently with the rest of the pipeline, not be awaited to completion
    # before the next stage is even spawned. Otherwise, once the function writes
    # more to its stdout pipe than the OS pipe buffer holds (commonly 64 KiB on
    # Linux) before returning, that write() blocks forever -- nothing is reading
    # the other end yet. A real shell always runs every stage as its own process.
    stdin: |
      big() {
        local i
        for i in $(seq 1 5000); do
          echo "padding line number ${i} to exceed the pipe buffer size"
        done
      }
      big | wc -l
      echo "Last: $?, PIPESTATUS: ${PIPESTATUS[*]}"
